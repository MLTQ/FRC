[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "plasma-bench"
version = "0.1.0"
description = "Verified axisymmetric vacuum and stationary resistive plasma experiments"
requires-python = ">=3.11"
dependencies = ["numpy>=2.1,<3", "scipy>=1.14,<2", "matplotlib>=3.9,<4", "contourpy>=1.3,<2", "pillow>=11,<13"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
plasma-bench = "plasma_bench.cli:main"

[tool.setuptools.packages.find]
include = ["plasma_bench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
