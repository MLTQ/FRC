[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "plasma-bench"
version = "0.1.0"
description = "Verified axisymmetric vacuum and stationary resistive plasma experiments"
requires-python = ">=3.11"
dependencies = ["numpy>=2.1,<3", "scipy>=1.14,<2", "matplotlib>=3.9,<4", "contourpy>=1.3,<2", "pillow>=11,<13"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
precision = ["gmpy2==2.3.2"]
metal = ["mlx==0.32.4; sys_platform == 'darwin' and platform_machine == 'arm64'"]
electrostatic = ["gmsh==4.15.2", "numba>=0.61,<1"]

[project.scripts]
plasma-bench = "plasma_bench.cli:main"

[tool.setuptools.packages.find]
include = ["plasma_bench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
